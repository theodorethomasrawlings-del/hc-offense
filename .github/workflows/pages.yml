name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The full-detail chart (tag v1-full) stays reachable at /v1/ with its own service worker.
      - run: |
          git fetch --depth=1 origin tag v1-full
          git worktree add ../v1 v1-full
          cd ../v1 && npm ci && npm run build
          mkdir -p "$GITHUB_WORKSPACE/dist/v1" && cp -R dist/. "$GITHUB_WORKSPACE/dist/v1/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
